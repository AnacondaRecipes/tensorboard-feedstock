{% set name = "tensorboard" %}
{% set version = "2.21.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/py3/t/tensorboard/tensorboard-{{ version }}-py3-none-any.whl
  sha256: 7279316dcb6bd5bc391d623dea841531299cde1887310e8133bc34a996d32255

build:
  number: 0
  skip: True  # [py<39]
  entry_points:
    - tensorboard = tensorboard.main:run_main

requirements:
  host:
    - python
    - pip
    - setuptools <82
    - wheel
  run:
    - python
    - absl-py >=0.4
    - grpcio >=1.74.0,<2.0
    - markdown >=2.6.8
    - numpy >=1.12.0
    - packaging
    - pillow
    - protobuf >=6.31.1,<8.0.0
    - setuptools >=41.0.0
    - tensorboard-data-server >=0.7.0,<0.8.0
    - werkzeug >=1.0.1
  run_constrained:
    # ModuleNotFoundError: No module named 'pkg_resources'
    - setuptools <82

test:
  requires:
    - pip
  imports:
    - tensorboard
  commands:
    - tensorboard -h
    - pip check

about:
  home: https://www.tensorflow.org/tensorboard
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: TensorFlow's Visualization Toolkit
  description: |
    TensorBoard is a suite of web applications for inspecting and understanding your TensorFlow runs and graphs.
  dev_url: https://github.com/tensorflow/tensorboard
  doc_url: https://www.tensorflow.org/tensorboard/get_started

extra:
  recipe-maintainers:
    - sdvillal
    - gilbertfrancois
    - farhantejani
    - mdraw
    - jschueller
    - xhochy
    - ngam
