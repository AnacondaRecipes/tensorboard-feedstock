{% set name = "tensorboard" %}
{% set version = "2.20.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/py3/t/tensorboard/tensorboard-{{ version }}-py3-none-any.whl
  sha256: 9dc9f978cb84c0723acf9a345d96c184f0293d18f166bb8d59ee098e6cfaaba6

build:
  number: 0
  skip: True  # [py<39]
  entry_points:
    - tensorboard = tensorboard.main:run_main

requirements:
  build:
    - msys2-sed # [win]
    - sed # [unix]
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - absl-py >=0.4
    - grpcio >=1.48.2
    - markdown >=2.6.8
    - numpy >=1.12.0
    - packaging
    - pillow
    - protobuf >=3.19.6,!=4.24.0
    - setuptools >=41.0.0
    - six >1.9
    - tensorboard-data-server >=0.7.0,<0.8.0
    - werkzeug >=1.0.1    

test:
  requires:
    - pip
  imports:
    - tensorboard
  commands:
    - tensorboard -h
    - pip check

about:
  home: https://www.tensorflow.org/tensorboard
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: TensorFlow's Visualization Toolkit
  description: |
    TensorBoard is a suite of web applications for inspecting and understanding your TensorFlow runs and graphs.
  dev_url: https://github.com/tensorflow/tensorboard
  doc_url: https://www.tensorflow.org/tensorboard/get_started

extra:
  recipe-maintainers:
    - sdvillal
    - gilbertfrancois
    - farhantejani
    - mdraw
    - jschueller
    - xhochy
    - ngam
